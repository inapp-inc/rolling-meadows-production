# Production — single port (app + PostgreSQL)
# Set PUBLIC_URL and APP_BASE_PATH in .env for your host (defaults use /case-management).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-case_management}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-case_management}
      POSTGRES_DB: ${POSTGRES_DB:-case_management}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-case_management} -d ${POSTGRES_DB:-case_management}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: case-management-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /case-management/api
        VITE_BASE_PATH: /case-management
        VITE_USE_MOCK_AUTH: "false"
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4510}:4510"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-case_management}:${POSTGRES_PASSWORD:-case_management}@postgres:5432/${POSTGRES_DB:-case_management}
      APP_BASE_PATH: /case-management
      STATIC_DIR: /app/static
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4510/case-management}
      API_ENABLED_MODULES: health,auth,admin,platform,clients,catalog,cases,enrollments,liaison,workflow,documents,reports
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4510}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-ChangeMe123!}
      DEFAULT_TENANT_ID: tenant-demo
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - branding_data:/app/branding

volumes:
  postgres_data:
  branding_data:
